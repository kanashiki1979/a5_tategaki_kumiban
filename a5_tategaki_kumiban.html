<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A5 縦書き組版ツール</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;--bg:#f2f1ee;--pn:#fff;--tx:#222;--bd:#ccc;--ac:#2a5bd7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--pn:#2a2a2d;--tx:#eee;--bd:#444;--ac:#7aa2ff}}
:root[data-theme="dark"]{--bg:#1c1c1e;--pn:#2a2a2d;--tx:#eee;--bd:#444;--ac:#7aa2ff}
html{-webkit-text-size-adjust:none;text-size-adjust:none;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Noto Sans JP",sans-serif}
.app{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px}
@media(max-width:800px){.app{grid-template-columns:1fr}}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;align-self:start}
label{display:flex;flex-direction:column;gap:3px;font-size:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
input,select,textarea{font:inherit;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
textarea{min-height:220px;resize:vertical}
button{font:inherit;padding:10px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
.note{font-size:11px;opacity:.7}
#pvw{overflow-x:auto;min-width:0}
#pv{display:grid;grid-template-columns:repeat(2,148mm);column-gap:0;row-gap:14px;width:max-content;align-items:start}
.page{position:relative;width:148mm;height:210mm;background:#fff;color:#000;box-shadow:0 1px 6px rgba(0,0,0,.35);overflow:hidden}
.clip{position:absolute;overflow:hidden}
.flow{position:absolute;top:0;writing-mode:vertical-rl;text-align:justify;line-break:strict;overflow-wrap:break-word;text-combine-upright:digits 2;font-kerning:normal}
.flow p{margin:0;white-space:pre-wrap}
.flow p.ind{text-indent:1em}
.hf{position:absolute;font-size:8pt;line-height:1;text-align:center;white-space:nowrap}
@media(max-width:800px){#pv{grid-template-columns:148mm}#pv .page{grid-row:auto!important;grid-column:auto!important}}
@page{size:148mm 210mm;margin:0}
@media print{
 html,body{background:#fff;margin:0}
 .app{display:block;padding:0}.panel{display:none}
 #pv{display:block;width:auto;zoom:1!important}
 .page{box-shadow:none;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .page:last-child{break-after:auto;page-break-after:auto}
}
</style></head>
<body>
<div class="app">
<div class="panel">
 <label>本文<textarea id="text">吾輩は猫である。名前はまだ無い。
どこで生れたかとんと見当がつかぬ。何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。

ここに本文を入力してください。改行で段落になり、空行を入れると一行空きます。2026年のような数字も縦中横になります。</textarea></label>
 <div class="row">
  <label>段組み<select id="cols"><option value="1">1段</option><option value="2">2段</option></select></label>
  <label>文字サイズ<select id="size"><option>8</option><option>9</option><option>9.5</option><option selected>10</option><option>10.5</option><option>11</option><option>12</option><option>14</option></select></label>
 </div>
 <div class="row">
  <label>書体<select id="font"><option value="Noto Serif JP">明朝</option><option value="Noto Sans JP">ゴシック</option></select></label>
  <label>綴じしろ(20mm)<select id="bind"><option value="gutter">ノド(両面印刷用)</option><option value="both">両端(袋とじ用)</option></select></label>
 </div>
 <div class="row"><label>ヘッダー<input id="hd"></label>
  <label style="flex:0 0 110px">ヘッダー位置<select id="hp"><option value="outer">ページ外側</option><option value="center">ページ中央</option><option value="inner">ページ内側</option></select></label></div>
 <label>フッター<input id="ft"></label>
 <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="ls" checked>左始まり(1ページ目が左。オフで右始まり)</label>
 <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="ai">段落頭を自動で1字下げ(行頭の空白は除去。「『（始まりは下げない)</label>
 <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="pn" checked>ページ番号を表示</label>
 <button id="pdf">PDFで書き出す</button>
 <div id="st" class="note"></div>
 <div class="note">A5・縦書き。天地・小口15mm、綴じしろ20mm。左始まりは右綴じ(見開きで1 / 3 2 / 5 4…)、右始まりは左綴じ(見開きで1 / 2 3 / 4 5…)。PDFは300dpiの画像として保存されます(文字選択は不可)。</div>
</div>
<div id="pvw"><div id="pv"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let timer,busy=false,again=false,LAST=null;
function pinfo(p,ls,both){const n=p+1,left=ls?(n%2===1):(n%2===0);return{n,left,ml:both?20:(left?15:20)}} // 左ページ:ノドは右 / 右ページ:ノドは左
function halign(hp,left){return hp==='center'?'center':((hp==='outer')===left?'left':'right')}
function fit(){const mob=matchMedia('(max-width:800px)').matches,w=$('pvw').clientWidth,need=(mob?1:2)*148*PX;$('pv').style.zoom=Math.min(1,w/need)}
addEventListener('resize',fit);
const PX=96/25.4, PT=25.4/72;
async function render(){
 if(busy){again=true;return}
 busy=true;
 try{
  const ls=$('ls').checked,sz=+$('size').value,font=$('font').value,rows=+$('cols').value,both=$('bind').value==='both';
  const text=$('text').value;
  const CW=113,CH=180,GAP=8,h=rows===2?(CH-GAP)/2:CH;
  const N=Math.max(1,Math.floor(CW/(sz*PT*1.75))),pitch=CW/N;
  await Promise.race([
   Promise.all([document.fonts.load(`${sz}pt "${font}"`,text+'0123456789'),document.fonts.load(`bold ${sz}pt "${font}"`,'a')]),
   new Promise(r=>setTimeout(r,5000))]);
  const ai=$('ai').checked;
  const html=text.split(/\r\n|\r|\n/).map(l=>{
   if(!l.trim())return '<p><br></p>';
   if(!ai)return `<p>${esc(l)}</p>`; // 入力のまま(自動の字下げ・空白追加なし)
   const t=l.replace(/^[\s\u3000]+/,'');
   return `<p${/^[「『（(〈《【〔\[]/.test(t)?'':' class="ind"'}>${esc(t)}</p>`;
  }).join('');
  const fs=`font-family:'${font}',serif;font-size:${sz}pt;line-height:${pitch}mm;height:${h}mm;`;
  // measure
  const m=document.createElement('div');m.className='flow';m.style.cssText=fs+'left:-99999px;visibility:hidden';
  m.innerHTML=html;document.body.appendChild(m);
  const lines=Math.max(1,Math.round(m.getBoundingClientRect().width/(pitch*PX)));
  m.remove();
  const pages=Math.max(1,Math.ceil(lines/(N*rows)));
  const pv=$('pv');pv.innerHTML='';
  const hd=esc($('hd').value),ft=esc($('ft').value);
  for(let p=0;p<pages;p++){
   const {n,left,ml}=pinfo(p,ls,both);
   const pg=document.createElement('div');pg.className='page';
   pg.style.gridRow=Math.floor(n/2)+1;pg.style.gridColumn=left?1:2;
   let s='';
   for(let r=0;r<rows;r++){
    const k=p*rows+r;
    s+=`<div class="clip" style="left:${ml}mm;top:${15+r*(h+GAP)}mm;width:${CW}mm;height:${h}mm"><div class="flow" style="${fs}right:${-k*CW}mm">${html}</div></div>`;
   }
   const al=halign($('hp').value,left);
   s+=`<div class="hf" style="left:${ml}mm;width:${CW}mm;top:7mm;text-align:${al}">${hd}</div>`;
   s+=`<div class="hf" style="left:${ml}mm;width:${CW}mm;bottom:7mm">${ft}</div>`;
   if($('pn').checked){
    const pos=both?`left:${ml}mm;width:${CW}mm`:(left?'left:15mm':'right:15mm');
    s+=`<div class="hf" style="bottom:7mm;${pos}">${n}</div>`;
   }
   pg.innerHTML=s;pv.appendChild(pg);
  }
  LAST={html,fs,N,pitch,h,rows,sz,font,both,ls,pages,hd:$('hd').value,ft:$('ft').value,hp:$('hp').value,pn:$('pn').checked};
  $('st').textContent=`${pages}ページ(${lines}行)`;fit();
 }catch(e){console.error(e);$('st').textContent='エラー: '+e.message}
 busy=false;
 if(again){again=false;render()}
}
function sched(){clearTimeout(timer);timer=setTimeout(render,400)}
['text','cols','size','font','bind','hd','hp','ai','ft','pn','ls'].forEach(i=>$(i).addEventListener('input',sched));

const ROT=/[ー―—–〜～…‥（）「」『』〈〉《》【】〔〕［］｛｝＜＞＝：；＋－＿]/,SHIFT=/[、。，．]/,SMALL=/[ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ]/;
function extract(){
 const L=LAST,m=document.createElement('div');m.className='flow';m.style.cssText=L.fs+'left:-99999px;visibility:hidden';
 m.innerHTML=L.html;document.body.appendChild(m);
 const b=m.getBoundingClientRect(),pp=L.pitch*PX,out=[],r=document.createRange(),tw=document.createTreeWalker(m,NodeFilter.SHOW_TEXT);
 for(let nd;nd=tw.nextNode();){const t=nd.data;for(let i=0;i<t.length;){
  const ch=String.fromCodePoint(t.codePointAt(i)),len=ch.length;
  if(!/\s/.test(ch)){r.setStart(nd,i);r.setEnd(nd,i+len);const q=r.getClientRects()[0];
   if(q)out.push({ch,line:Math.floor((b.right-(q.left+q.right)/2)/pp),y:(q.top-b.top)/PX});}
  i+=len;}}
 m.remove();
 for(let i=0;i+1<out.length;i++){const a=out[i],c=out[i+1];if(/\d/.test(a.ch)&&/\d/.test(c.ch)&&Math.abs(a.y-c.y)<.05&&a.line===c.line){a.tcy=a.ch+c.ch;c.skip=1;i++}}
 return out;
}
function drawPage(p,byK,M){
 const L=LAST,{n,left,ml}=pinfo(p,L.ls,L.both),cv=document.createElement('canvas');cv.width=Math.round(148*M);cv.height=Math.round(210*M);
 const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.fillStyle='#000';
 const f=L.sz*PT*M,CW=113,GAP=8;
 g.font=`${f}px '${L.font}',serif`;
 for(let r=0;r<L.rows;r++){const k=p*L.rows+r,y0=15+r*(L.h+GAP);
  for(const c of byK.get(k)||[]){
   if(c.skip)continue;
   const x=(ml+CW-((c.line-k*L.N)+.5)*L.pitch)*M,y=(y0+c.y)*M;
   if(c.tcy){const w=g.measureText(c.tcy).width;g.save();g.translate(x,y+.88*f);g.scale(Math.min(1,f/w),1);g.textAlign='center';g.textBaseline='alphabetic';g.fillText(c.tcy,0,0);g.restore();continue}
   if(/[!-~]/.test(c.ch)||ROT.test(c.ch)){g.save();g.translate(x-.38*f,y);g.rotate(Math.PI/2);g.textAlign='left';g.textBaseline='alphabetic';g.fillText(c.ch,0,0);g.restore();continue}
   let dx=0,dy=0;if(SHIFT.test(c.ch)){dx=.5*f;dy=-.5*f}else if(SMALL.test(c.ch)){dx=.09*f;dy=-.09*f}
   g.textAlign='center';g.textBaseline='alphabetic';g.fillText(c.ch,x+dx,y+.88*f+dy);
  }}
 g.font=`${8*PT*M}px 'Noto Sans JP',sans-serif`;g.textBaseline='middle';
 const hy=(7+4*PT)*M,fy=(210-7-4*PT)*M,txt=(t,x,y,al)=>{g.textAlign=al;g.fillText(t,x*M,y)};
 const al=halign(L.hp,left);txt(L.hd,al==='left'?ml:al==='right'?ml+CW:ml+CW/2,hy,al);
 txt(L.ft,ml+CW/2,fy,'center');
 if(L.pn){if(L.both)txt(String(n),ml+CW/2,fy,'center');else txt(String(n),left?15:133,fy,left?'left':'right')}
 return cv;
}
function makePDF(jpgs){
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const push=d=>{const u=typeof d==='string'?enc.encode(d):d;parts.push(u);len+=u.length},P=jpgs.length;
 push('%PDF-1.4\n');
 offs[1]=len;push('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
 offs[2]=len;push(`2 0 obj\n<</Type/Pages/Count ${P}/Kids[${jpgs.map((_,i)=>`${3+3*i} 0 R`).join(' ')}]>>\nendobj\n`);
 const W=419.53,H=595.28;
 jpgs.forEach((j,i)=>{const a=3+3*i,c=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  offs[a]=len;push(`${a} 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</Im0 ${a+2} 0 R>>>>/Contents ${a+1} 0 R>>\nendobj\n`);
  offs[a+1]=len;push(`${a+1} 0 obj\n<</Length ${c.length}>>\nstream\n${c}\nendstream\nendobj\n`);
  offs[a+2]=len;push(`${a+2} 0 obj\n<</Type/XObject/Subtype/Image/Width ${j.w}/Height ${j.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${j.d.length}>>\nstream\n`);push(j.d);push('\nendstream\nendobj\n');});
 const T=2+3*P,xo=len;
 push(`xref\n0 ${T+1}\n0000000000 65535 f \n`+offs.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join(''));
 push(`trailer\n<</Size ${T+1}/Root 1 0 R>>\nstartxref\n${xo}\n%%EOF`);
 return new Blob(parts,{type:'application/pdf'});
}
async function savePDF(){
 const btn=$('pdf'),label=btn.textContent;btn.disabled=true;
 try{
  clearTimeout(timer);while(busy)await new Promise(r=>setTimeout(r,100));await render();
  const L=LAST,M=300/25.4;
  await Promise.race([Promise.all([document.fonts.load(`${L.sz}pt '${L.font}'`,$('text').value),document.fonts.load("8pt 'Noto Sans JP'",L.hd+L.ft+'0123456789')]),new Promise(r=>setTimeout(r,8000))]);
  const chars=extract(),byK=new Map();
  chars.forEach(c=>{const k=Math.floor(c.line/L.N);if(!byK.has(k))byK.set(k,[]);byK.get(k).push(c)});
  const jpgs=[];
  for(let p=0;p<L.pages;p++){
   btn.textContent=`PDF作成中 ${p+1}/${L.pages}`;await new Promise(r=>setTimeout(r,0));
   const cv=drawPage(p,byK,M),b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));
   jpgs.push({d:new Uint8Array(await b.arrayBuffer()),w:cv.width,h:cv.height});
  }
  const blob=makePDF(jpgs);
  const dl=window.claude?await claude.use('downloads'):null;
  if(dl){await dl.save({filename:'a5-tategaki.pdf',data:blob});}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='a5-tategaki.pdf';document.body.appendChild(a);a.click();a.remove();}
 }catch(e){if(!e||e.code!=='declined'){console.error(e);$('st').textContent='PDF作成エラー: '+(e&&e.message||e)}}
 btn.disabled=false;btn.textContent=label;
}
$('pdf').onclick=savePDF;
render();
</script>
</body></html>
